name: lines
# Each run loops for ~5.5h, refreshing every 3 min (bin/loop.sh). The cron only needs to keep one run
# queued behind the active one; late cron starts don't matter because the queued run starts the moment
# the active one ends.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lines
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --only-shell --with-deps chromium
      - run: npm test
      - name: Refresh lines every 3 minutes
        run: bin/loop.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEARTBEAT_URL_BRACCO_LINES: ${{ secrets.HEARTBEAT_URL_BRACCO_LINES }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_BOT_TOKEN: ${{ secrets.MATRIX_BOT_TOKEN }}
          MATRIX_ROOM_KAZ_OPS: ${{ secrets.MATRIX_ROOM_KAZ_OPS }}
          MATRIX_ROOM_ALERTS_FIREHOSE: ${{ secrets.MATRIX_ROOM_ALERTS_FIREHOSE }}
      - name: Alert #kaz-ops
        if: failure()
        run: node bin/notify.mjs kaz-ops error "lines job failed, feed is going stale: $RUN_URL"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_BOT_TOKEN: ${{ secrets.MATRIX_BOT_TOKEN }}
          MATRIX_ROOM_KAZ_OPS: ${{ secrets.MATRIX_ROOM_KAZ_OPS }}
          MATRIX_ROOM_ALERTS_FIREHOSE: ${{ secrets.MATRIX_ROOM_ALERTS_FIREHOSE }}
